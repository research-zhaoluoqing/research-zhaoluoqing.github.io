<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img"
     aria-label="Two trajectories for the same hour of expert time. A correction that lands on the output keeps expert effort flat; a correction that lands in the system makes it fall.">
  <style>
    .bg    { fill: #fcfcfb; }
    .axis  { stroke: #c2c9d3; }
    .grid  { stroke: #e6eaef; }
    .flat  { fill: none; stroke: #a3564e; }
    .fall  { fill: none; stroke: #3d4d70; }
    .knot  { fill: #55606d; }
    .t     { fill: #1a1d21; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
    .s     { fill: #55606d; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
    .f     { fill: #8a94a0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
    .lflat { fill: #a3564e; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
    .lfall { fill: #3d4d70; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #14171b; }
      .axis  { stroke: #3a424d; }
      .grid  { stroke: #23282f; }
      .flat  { stroke: #d98b80; }
      .fall  { stroke: #9fbde8; }
      .knot  { fill: #a8b2be; }
      .t     { fill: #e7eaee; }
      .s     { fill: #a8b2be; }
      .f     { fill: #6f7986; }
      .lflat { fill: #d98b80; }
      .lfall { fill: #9fbde8; }
    }
  </style>

  <rect class="bg" width="600" height="400"/>

  <text class="t" x="40" y="46" font-size="21" font-weight="600">Where the correction goes</text>
  <text class="s" x="40" y="70" font-size="13.5">Same hour of expert time. Opposite trajectory.</text>

  <!-- grid -->
  <g class="grid" stroke-width="1">
    <line x1="92" y1="130" x2="556" y2="130"/>
    <line x1="92" y1="180" x2="556" y2="180"/>
    <line x1="92" y1="230" x2="556" y2="230"/>
    <line x1="92" y1="280" x2="556" y2="280"/>
  </g>

  <!-- axes -->
  <line class="axis" x1="92" y1="100" x2="92"  y2="312" stroke-width="1.4"/>
  <line class="axis" x1="92" y1="312" x2="556" y2="312" stroke-width="1.4"/>

  <!-- the branch point -->
  <circle class="knot" cx="120" cy="120" r="4"/>
  <text class="f" x="112" y="108" font-size="11.5" text-anchor="end">an error is caught</text>

  <!-- into the output : flat -->
  <path class="flat" d="M120 120 L 200 122 L 290 119 L 380 122 L 470 120 L 545 121"
        stroke-width="2.2"/>
  <text class="lflat" x="545" y="106" font-size="12.5" font-weight="600" text-anchor="end">into the output</text>
  <text class="f"     x="545" y="90"  font-size="11.5" text-anchor="end">the case is fixed; nothing else changes</text>

  <!-- into the system : falls -->
  <path class="fall" d="M120 120 C 200 132, 250 186, 320 222 S 460 274, 545 286"
        stroke-width="2.2"/>
  <text class="lfall" x="545" y="272" font-size="12.5" font-weight="600" text-anchor="end">into the system</text>
  <text class="f"     x="545" y="256" font-size="11.5" text-anchor="end">that class of failure closes</text>

  <!-- the pilot window: the two are indistinguishable -->
  <rect x="120" y="96" width="86" height="216" fill="#8a94a0" opacity="0.10"/>
  <line class="axis" x1="206" y1="96" x2="206" y2="312" stroke-width="1" stroke-dasharray="4 4"/>
  <text class="f" x="163" y="332" font-size="11.5" text-anchor="middle">six weeks</text>
  <text class="f" x="163" y="348" font-size="11.5" text-anchor="middle">identical here</text>

  <!-- labels -->
  <text class="s" x="72" y="106" font-size="11.5" text-anchor="end" transform="rotate(-90 72 206)">expert hours on the same error class</text>
  <text class="f" x="556" y="332" font-size="11.5" text-anchor="end">time</text>

  <line class="grid" x1="40" y1="366" x2="560" y2="366" stroke-width="1"/>
  <text class="t" x="40" y="390" font-size="13.5" font-weight="600">A short trial cannot tell you which one you have.</text>
</svg>
