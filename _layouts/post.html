---
layout: default
---
<article class="post">
  <header>
    <h1>{{ page.title }}</h1>
    <p class="meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
      {% if page.standfirst %}<span class="sep">·</span> {{ page.standfirst }}{% endif %}
    </p>
  </header>

  {{ content }}
</article>

<nav class="post-nav">
  <a href="{{ '/writing/' | relative_url }}">← All writing</a>
</nav>
